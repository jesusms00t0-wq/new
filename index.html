<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sky Hop</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #0b1020;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas {
      width: min(100vw, 480px);
      height: min(100vh, 800px);
      max-height: 100vh;
      display: block;
      touch-action: none;
      cursor: pointer;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Sky Hop game"></canvas>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const W = 480;
    const H = 800;
    const groundHeight = 92;
    const pipeWidth = 82;

    canvas.width = W;
    canvas.height = H;

    let state = "ready";
    let score = 0;
    let best = Number(localStorage.getItem("sky-hop-best") || 0);
    let frame = 0;
    let flash = 0;
    let bird;
    let pipes;

    function reset() {
      bird = { x: 130, y: 350, vy: 0, radius: 18, rotation: 0 };
      pipes = [];
      score = 0;
      frame = 0;
      flash = 0;
    }

    function flap() {
      if (state === "ready") {
        reset();
        state = "playing";
        bird.vy = -8.3;
      } else if (state === "playing") {
        bird.vy = -8.3;
      } else if (state === "gameover") {
        state = "ready";
        reset();
      }
    }

    function spawnPipe() {
      const gap = Math.max(150, 190 - Math.min(score * 2, 40));
      const margin = 80;
      const top = margin + Math.random() * (H - groundHeight - gap - margin * 2);
      pipes.push({ x: W + 30, top, gap, passed: false });
    }

    function update() {
      frame++;

      if (state === "playing") {
        bird.vy += 0.48;
        bird.y += bird.vy;
        bird.rotation = Math.max(-0.45, Math.min(1.2, bird.vy * 0.09));

        if (frame % 105 === 0) spawnPipe();

        for (const pipe of pipes) {
          pipe.x -= 3.15;
          if (!pipe.passed && pipe.x + pipeWidth < bird.x) {
            pipe.passed = true;
            score++;
            if (score > best) {
              best = score;
              localStorage.setItem("sky-hop-best", best);
            }
          }
        }
        pipes = pipes.filter(pipe => pipe.x + pipeWidth > -20);

        for (const pipe of pipes) {
          const inX = bird.x + bird.radius > pipe.x && bird.x - bird.radius < pipe.x + pipeWidth;
          if (inX && (bird.y - bird.radius < pipe.top || bird.y + bird.radius > pipe.top + pipe.gap)) {
            endGame();
            break;
          }
        }

        if (bird.y - bird.radius < 0 || bird.y + bird.radius > H - groundHeight) endGame();
      } else if (state === "ready") {
        bird.y = 350 + Math.sin(frame * 0.05) * 8;
        bird.rotation = Math.sin(frame * 0.05) * 0.06;
      }

      flash = Math.max(0, flash - 0.08);
    }

    function endGame() {
      if (state !== "playing") return;
      state = "gameover";
      flash = 1;
      if (bird.y + bird.radius > H - groundHeight) bird.y = H - groundHeight - bird.radius;
    }

    function roundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
    }

    function drawBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, "#62c8ef");
      sky.addColorStop(0.7, "#b8ebfa");
      sky.addColorStop(1, "#e9f8eb");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = "rgba(255,255,255,.72)";
      for (let i = 0; i < 5; i++) {
        const x = ((i * 135 - frame * 0.12) % 610) - 70;
        const y = 95 + (i % 3) * 95;
        ctx.beginPath();
        ctx.arc(x, y, 25, 0, Math.PI * 2);
        ctx.arc(x + 28, y - 8, 34, 0, Math.PI * 2);
        ctx.arc(x + 58, y, 24, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = "#64bd75";
      ctx.beginPath();
      ctx.moveTo(0, 650);
      for (let x = 0; x <= W; x += 40) {
        ctx.lineTo(x, 650 - Math.sin((x + frame * 0.2) / 80) * 18 - 20);
      }
      ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

      ctx.fillStyle = "#68b84f";
      ctx.fillRect(0, H - groundHeight, W, groundHeight);
      ctx.fillStyle = "#4b983d";
      ctx.fillRect(0, H - groundHeight, W, 12);
      ctx.fillStyle = "#8ed66b";
      for (let x = -(frame * 2 % 32); x < W; x += 32) {
        ctx.beginPath();
        ctx.moveTo(x, H - groundHeight + 12);
        ctx.lineTo(x + 16, H - groundHeight + 12);
        ctx.lineTo(x + 26, H - 1);
        ctx.lineTo(x + 10, H - 1);
        ctx.closePath(); ctx.fill();
      }
    }

    function drawPipe(pipe) {
      const green = "#55b73d";
      ctx.fillStyle = green;
      ctx.fillRect(pipe.x, -4, pipeWidth, pipe.top + 4);
      ctx.fillRect(pipe.x, pipe.top + pipe.gap, pipeWidth, H - groundHeight - pipe.top - pipe.gap);

      ctx.fillStyle = "#74d04d";
      ctx.fillRect(pipe.x + 8, -4, 14, pipe.top + 4);
      ctx.fillRect(pipe.x + 8, pipe.top + pipe.gap, 14, H - groundHeight - pipe.top - pipe.gap);

      ctx.fillStyle = "#3d9630";
      ctx.fillRect(pipe.x - 5, pipe.top - 30, pipeWidth + 10, 30);
      ctx.fillRect(pipe.x - 5, pipe.top + pipe.gap, pipeWidth + 10, 30);
      ctx.fillStyle = "#70cb48";
      ctx.fillRect(pipe.x + 3, pipe.top - 30, pipeWidth - 6, 8);
      ctx.fillRect(pipe.x + 3, pipe.top + pipe.gap, pipeWidth - 6, 8);
    }

    function drawBird() {
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(bird.rotation);

      ctx.fillStyle = "rgba(0,0,0,.12)";
      ctx.beginPath(); ctx.ellipse(1, 20, 24, 7, 0, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = "#ffd83d";
      ctx.beginPath(); ctx.ellipse(0, 0, 25, 20, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#ca8d20"; ctx.lineWidth = 4; ctx.stroke();

      ctx.fillStyle = "#f2b92d";
      ctx.beginPath(); ctx.ellipse(-15, 7, 14, 8, -0.3, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(10, -7, 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#222";
      ctx.beginPath(); ctx.arc(13, -7, 4, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = "#ff8533";
      ctx.beginPath(); ctx.moveTo(20, 2); ctx.lineTo(38, 8); ctx.lineTo(20, 13); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "#a84d20"; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    }

    function drawScore() {
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "900 54px system-ui";
      ctx.lineWidth = 10;
      ctx.strokeStyle = "rgba(40,70,90,.45)";
      ctx.strokeText(score, W / 2, 82);
      ctx.fillStyle = "#fff";
      ctx.fillText(score, W / 2, 82);
    }

    function drawPanel() {
      ctx.fillStyle = "rgba(20, 42, 58, .82)";
      roundedRect(70, 250, 340, 250, 24); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 3; ctx.stroke();

      ctx.textAlign = "center";
      ctx.fillStyle = "#fff";
      ctx.font = "900 44px system-ui";
      ctx.fillText(state === "ready" ? "SKY HOP" : "GAME OVER", W / 2, 310);

      ctx.font = "700 18px system-ui";
      ctx.fillStyle = "#d8edf5";
      ctx.fillText(state === "ready" ? "Tap or press Space to flap" : `Score: ${score}   Best: ${best}`, W / 2, 352);

      ctx.fillStyle = "#ffd83d";
      roundedRect(145, 390, 190, 58, 29); ctx.fill();
      ctx.fillStyle = "#6b4c00";
      ctx.font = "900 22px system-ui";
      ctx.fillText(state === "ready" ? "START" : "TRY AGAIN", W / 2, 420);
    }

    function draw() {
      drawBackground();
      pipes.forEach(drawPipe);
      drawBird();

      if (state === "playing") drawScore();
      if (state !== "playing") drawPanel();

      if (flash > 0) {
        ctx.fillStyle = `rgba(255,255,255,${flash * 0.7})`;
        ctx.fillRect(0, 0, W, H);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    canvas.addEventListener("pointerdown", event => {
      event.preventDefault();
      flap();
    });
    window.addEventListener("keydown", event => {
      if (event.code === "Space" || event.code === "ArrowUp") {
        event.preventDefault();
        flap();
      }
    });

    reset();
    loop();
  </script>
</body>
</html>
